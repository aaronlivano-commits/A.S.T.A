<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Mainframe - Stark Industries OS</title>
  <!-- "uvicorn backend.app.main:app --reload --port 8000" to start python -->
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PrismJS Syntax Highlight -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>
<body>

  <!-- Futuristic Holographic Scanning Lines & Grid overlay -->
  <div class="hologram-grid"></div>
  <div class="scanlines"></div>

  <!-- Main System App Layout -->
  <div id="app">
    
    <!-- Top System Header Status Bar -->
    <header class="hud-header">
      <div class="header-logo">
        <div class="reactor-core-mini"></div>
        <span class="hud-title">J.A.R.V.I.S.</span>
        <span class="hud-version">v1.0.0</span>
      </div>
      
      <div class="header-telemetry">
        <div class="telemetry-item" id="nav-clock-wrapper">
          <i class="fa-regular fa-clock text-cyan"></i>
          <span id="header-clock">00:00:00</span>
        </div>
        <div class="telemetry-item" id="nav-date-wrapper">
          <i class="fa-regular fa-calendar-days text-cyan"></i>
          <span id="header-date">12 JUL 2026</span>
        </div>
        <div class="telemetry-item">
          <i class="fa-solid fa-wifi text-cyan" id="internet-icon"></i>
          <span id="header-internet">SYS_ONLINE</span>
        </div>
        <div class="telemetry-item">
          <i class="fa-solid fa-server text-cyan"></i>
          <span id="header-server">MAINFRAME_CONNECTED</span>
        </div>
      </div>
    </header>

    <!-- Side Menu HUD Navigation -->
    <aside class="hud-sidebar">
      <nav class="sidebar-nav">
        <a href="#home" class="nav-btn active" data-hash="home">
          <i class="fa-solid fa-house"></i>
          <span>HOME</span>
        </a>
        <a href="#chat" class="nav-btn" data-hash="chat">
          <i class="fa-solid fa-comments"></i>
          <span>AI CHAT</span>
        </a>
        <a href="#voice" class="nav-btn" data-hash="voice">
          <i class="fa-solid fa-microphone"></i>
          <span>AI VOICE</span>
        </a>
        <a href="#vision" class="nav-btn" data-hash="vision">
          <i class="fa-solid fa-eye"></i>
          <span>VISION AI</span>
        </a>
        <a href="#document" class="nav-btn" data-hash="document">
          <i class="fa-solid fa-file-invoice"></i>
          <span>DOCUMENT AI</span>
        </a>
        <a href="#coding" class="nav-btn" data-hash="coding">
          <i class="fa-solid fa-code"></i>
          <span>CODING</span>
        </a>
        <a href="#search" class="nav-btn" data-hash="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>AI SEARCH</span>
        </a>
        <a href="#dashboard" class="nav-btn" data-hash="dashboard">
          <i class="fa-solid fa-chart-line"></i>
          <span>DASHBOARD</span>
        </a>
        <a href="#settings" class="nav-btn" data-hash="settings">
          <i class="fa-solid fa-gears"></i>
          <span>SETTINGS</span>
        </a>
      </nav>
      
      <!-- User profile slot at bottom -->
      <div class="user-profile-slot" id="user-profile-widget">
        <i class="fa-solid fa-circle-user text-cyan avatar-icon"></i>
        <div class="user-info-text">
          <span class="username-display" id="global-username">GUEST USER</span>
          <span class="user-status-text" id="global-user-status">OFFLINE PROTOCOL</span>
        </div>
      </div>
    </aside>

    <!-- Page Body View Container -->
    <main class="hud-content">
      <div id="page-container">
        <!-- SPA Pages are dynamically loaded here -->
        <div class="system-loader">
          <div class="spinner"></div>
          <span class="loading-text">BOOTING JARVIS MAINFRAME...</span>
        </div>
      </div>
    </main>

    <!-- Floating System Console Alerts -->
    <div class="console-toast-container" id="toast-container"></div>
  </div>

  <!-- Authentication Modal Overlay -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-content glassmorphism">
      <div class="modal-header">
        <h2 class="neon-text"><i class="fa-solid fa-shield-halved"></i> SECURE LOGIN</h2>
        <button class="close-btn" id="close-auth-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="auth-form">
          <div class="form-group">
            <label for="auth-username">OPERATOR USERNAME</label>
            <input type="text" id="auth-username" required placeholder="Enter username...">
          </div>
          <div class="form-group">
            <label for="auth-password">SECURITY PASSCODE</label>
            <input type="password" id="auth-password" required placeholder="Enter passcode...">
          </div>
          <div class="form-actions">
            <button type="submit" class="hud-btn glow-cyan" id="auth-submit-btn">ACCESS CORE</button>
            <button type="button" class="hud-btn secondary" id="auth-toggle-btn">REGISTER NEW CODE</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- CDN Dependency Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Modular JS Core -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
